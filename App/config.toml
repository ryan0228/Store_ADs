[paths]
work_root = 'D:\CASE\Shop_ADs'

[image]
width = 1080
height = 1080
default_style = "clean"
max_images_per_page = 4
output_format = "png"

[font]
regular = 'C:\Windows\Fonts\msjh.ttc'
bold = 'C:\Windows\Fonts\msjhbd.ttc'
title_size = 68
body_size = 36
footer_size = 42
minimum_size = 22

[styles.clean]
background_color = "#F7F5F2"
primary_color = "#234E70"
accent_color = "#F2B134"
title_color = "#222222"
body_color = "#444444"
card_color = "#FFFFFF"
border_color = "#FFFFFF"
safe_margin = 72
corner_radius = 26
shadow_blur = 18
rotation_degrees = 2.0

[ai]
# Google Gemini 多模態模型，用於選圖、分組與撰寫商品文案。
provider = "google"
model = "gemini-3.6-flash"
analysis_max_dimension = 768
max_input_images = 15
gif_frame_analysis = true
# 沒有廠商文字時，至少有此數量的可驗證資訊才產生最後摘要頁。
summary_min_facts = 3

[branding]
store_name = "情趣時光"
footer_image = "assets/branding/shop-footer.png"
footer_width = 250
footer_margin = 28
